[build]
  command = "npm install --legacy-peer-deps && npx expo export --platform web"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/proxy/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NPM_CONFIG_LEGACY_PEER_DEPS = "true"
  NODE_VERSION = "18"
